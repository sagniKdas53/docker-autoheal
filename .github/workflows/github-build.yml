name: build

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'Dockerfile'
      - 'docker-entrypoint'
      - 'tests/**'
  push:
    branches:
      - '**'
    tags:
      - '*'
    paths:
      - '.github/workflows/**'
      - 'Dockerfile'
      - 'docker-entrypoint'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v2
      -
        name: Run integration tests
        working-directory: tests
        env:
          AUTOHEAL_CONTAINER_LABEL: autoheal-${{ github.run_id }}
        run: ./tests.sh autoheal-${{ github.run_id }}

  multi:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v2
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      -
        name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      -
        name: Set image name
        run: |
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - if: github.ref == 'refs/heads/main'
        name: Conditional(Set tag as `latest`)
        run: echo "tag=${image_name}:latest" >> "$GITHUB_ENV"

      - if: startsWith(github.ref, 'refs/tags/')
        name: Conditional(Set tag as `{version}`)
        run: echo "tag=${image_name}:${GITHUB_REF#refs/*/}" >> "$GITHUB_ENV"

      -
        name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le
          tags: |
            ${{ env.tag }}
