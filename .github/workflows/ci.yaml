name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'Dockerfile'
      - 'docker-entrypoint'
      - 'tests/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'Dockerfile'
      - 'docker-entrypoint'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run integration tests
        working-directory: tests
        env:
          AUTOHEAL_CONTAINER_LABEL: autoheal-${{ github.run_id }}
        run: ./tests.sh autoheal-${{ github.run_id }}